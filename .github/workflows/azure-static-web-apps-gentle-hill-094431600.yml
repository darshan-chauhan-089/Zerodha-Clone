name: Azure Static Web Apps CI/CD - frontend of Zerodha Clone

on:
  push:
    branches:
      - working-on-charts
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - working-on-charts

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    env: 
      REACT_APP_API_URL: https://zerodha-clone-api-ewadg2gecde5gsb8.eastasia-01.azurewebsites.net
      REACT_APP_ZERODHA_DASHBOARD: https://jolly-stone-0de248a00.1.azurestaticapps.net
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Debug env
        run: |
          echo "REACT_APP_API_URL=$REACT_APP_API_URL"
          echo "REACT_APP_ZERODHA_DASHBOARD=$REACT_APP_ZERODHA_DASHBOARD"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_HILL_094431600 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "build" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_HILL_094431600 }}
          action: "close"
